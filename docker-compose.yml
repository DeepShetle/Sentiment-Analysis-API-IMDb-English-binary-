services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentiment_user
      POSTGRES_PASSWORD: sentiment_pass
      POSTGRES_DB: sentiment_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment_user -d sentiment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.12-slim
    working_dir: /mlflow
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir mlflow && \
        mlflow server --backend-store-uri sqlite:///mlflow.db \
          --default-artifact-root /mlflow/mlruns \
          --host 0.0.0.0 --port 5000 \
          --allowed-hosts mlflow,mlflow:*,localhost,localhost:*
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db      # mang theo registry ĐÃ CÓ từ Ngày 9, không tạo mới
      - ./mlruns:/mlflow/mlruns             # mang theo artifact ĐÃ CÓ
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentiment_user:sentiment_pass@postgres:5432/sentiment_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: sentiment-classifier
      MODEL_ALIAS: champion
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  postgres_data: